logLevel: info

# --------------------------------------------------
# SRT
# --------------------------------------------------

srt: yes
srtAddress: :8890

# --------------------------------------------------
# HLS
# --------------------------------------------------

hls: yes
hlsAddress: :8888
# Increase the segment duration slightly to give the browser a bigger buffer
hlsSegmentDuration: 2s
hlsPartDuration: 200ms

# Increase the number of segments held in the playlist 
hlsSegmentCount: 5

# --------------------------------------------------
# WebRTC
# --------------------------------------------------

webrtc: yes
webrtcAddress: :8889

webrtcLocalUDPAddress: :8189

# --------------------------------------------------
# Authentication
# --------------------------------------------------

authMethod: internal

authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: publish
        path:
      - action: read
        path:
