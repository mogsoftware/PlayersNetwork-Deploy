logLevel: info

# --------------------------------------------------
# SRT
# --------------------------------------------------

srt: yes
srtAddress: :8890

# --------------------------------------------------
# WebRTC
# --------------------------------------------------

webrtc: yes
webrtcAddress: :8889

webrtcLocalUDPAddress: :8189

# ICE
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - 172.20.20.47

# --------------------------------------------------
# Authentication
# --------------------------------------------------

authMethod: internal

authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: publish
        path:
      - action: read
        path: